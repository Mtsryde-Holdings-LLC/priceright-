version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: priceright-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: priceright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: priceright
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceright"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: priceright-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: priceright-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://priceright:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/priceright?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme123}@redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Background Workers
  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: priceright-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://priceright:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/priceright?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme123}@redis:6379
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

  # Prisma Studio (optional - for database management)
  prisma-studio:
    image: node:18-alpine
    container_name: priceright-prisma-studio
    working_dir: /app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://priceright:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/priceright?schema=public
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    command: sh -c "npm install prisma && npx prisma studio --port 5555"
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: priceright-network
